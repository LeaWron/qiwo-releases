name: Public update index
on:
  release:
    types: [published, edited, deleted, unpublished]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: public-update-index
  cancel-in-progress: false
jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Refresh stable release metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/update_index.py
      - name: Commit changed index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add updates/releases.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: refresh public update index'
          git push origin HEAD:main
